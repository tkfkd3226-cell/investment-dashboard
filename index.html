<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){
    var ua=navigator.userAgent||'';
    var desktopAppleUA=/Macintosh/.test(ua)&&!/(iPhone|iPad|iPod)/.test(ua);
    var touchApple=(navigator.maxTouchPoints||0)>0;
    var shortSide=Math.min(screen.width||9999,screen.height||9999);
    if(desktopAppleUA&&touchApple&&shortSide<=500){
      var viewport=document.querySelector('meta[name="viewport"]');
      if(viewport)viewport.setAttribute('content','width=1280');
      document.documentElement.classList.add('iphone-request-desktop');
    }
  })();
</script>
<title>투자 성과 대시보드</title>
<link rel="icon" href="favicon.png" type="image/png">
<script>
  document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');
</script>
</head>
<body>
<nav id="tabs" class="switcher" aria-label="대시보드 기준일 선택"></nav><div id="app"></div><div class="dash-tooltip" id="dashTooltip"></div>
<script>
  document.write('<script src="script.js?v=' + Date.now() + '"><\/script>');
</script>
</body>
</html>
