<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (function(){
    var ua=navigator.userAgent||'';
    var appleMobileUA=/(iPhone|iPad|iPod)/.test(ua);
    var desktopAppleUA=/Macintosh/.test(ua)&&!appleMobileUA;
    var touchApple=(navigator.maxTouchPoints||0)>0;
    var shortSide=Math.min(screen.width||9999,screen.height||9999);
    var previewViewport=0;
    try{
      var previewMode=new URLSearchParams(location.search).get('market-ai-preview');
      if(shortSide<=760){
        if(previewMode==='1')previewViewport=1280;
        if(previewMode==='2')previewViewport=768;
      }
    }catch(_){ }
    var viewport=document.querySelector('meta[name="viewport"]');
    if(previewViewport){
      if(viewport)viewport.setAttribute('content','width='+previewViewport);
      if(previewViewport===1280&&(appleMobileUA||desktopAppleUA)&&touchApple&&shortSide<=500)document.documentElement.classList.add('iphone-request-desktop');
      return;
    }
    if(desktopAppleUA&&touchApple&&shortSide<=500){
      if(viewport)viewport.setAttribute('content','width=1280');
      document.documentElement.classList.add('iphone-request-desktop');
    }
  })();
</script>
<title>투자 성과 대시보드</title>
<link rel="icon" href="favicon.png" type="image/png">
<script>
  (function(){
    try{
      if(localStorage.getItem('investmentDashboard.theme')==='dark') document.documentElement.classList.add('dark');
      if(localStorage.getItem('investmentDashboard.cornerTheme')==='rounded') document.documentElement.classList.add('rounded-corners');
    }catch(_){ }
  })();
</script>
<script>
  (function(){
    const version=Date.now();
    const cssFiles=[
      'common.css',
      'tablet.css',
      'mobile.css',
      'special.css',
      'interaction.css',
      'print.css'
    ];
    cssFiles.forEach(file=>{
      document.write('<link rel="stylesheet" href="css/'+file+'?v='+version+'">');
    });
  })();
</script>
</head>
<body>
<nav id="tabs" class="switcher" aria-label="대시보드 기준일 선택"></nav><div id="app"></div><div class="dash-tooltip" id="dashTooltip"></div>
<script>
  (function(){
    const version=Date.now();
    const moduleFiles=[
      'dashboard-core.js',
      'dashboard-ui-common.js',
      'dashboard-charts.js',
      'dashboard-ui.js',
      'dashboard-pension.js',
      'dashboard-pension-editor.js'
    ];
    const imports=Object.fromEntries(moduleFiles.map(file=>[
      './js/'+file,
      './js/'+file+'?v='+version
    ]));
    document.write('<script type="importmap">'+JSON.stringify({imports})+'<\/script>');
    document.write('<script type="module" src="js/dashboard-app.js?v='+version+'"><\/script>');
    document.write('<script type="module" src="js/dashboard-market-ai.js?v='+version+'"><\/script>');
  })();
</script>
</body>
</html>
