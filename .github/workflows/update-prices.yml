name: Update KRX closing prices
run-name: KRX update ${{ inputs.date || 'auto' }} · ${{ inputs.request_id || 'manual' }}

# Manual-only workflow.
# - date 지정: 실제 KRX 거래일인지 확인한 뒤 해당 날짜의 종목 가격/성과를 갱신하고, 지정일까지 저장된 KOSPI 구간은 누락·정정값을 backfill
# - date 비움: Python이 최신·누락·장중 재확정 대상을 자동 판단
on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD. 지정하면 해당 거래일의 종목 가격/성과를 갱신하고 지정일까지 저장된 KOSPI 구간의 누락·정정값을 backfill. 비워두면 최신·누락·장중 재확정 대상 날짜를 자동 판단"
        required: false
        type: string
      request_id:
        description: "GAS에서 생성한 stable requestId. dispatch 추적/중복 방지용"
        required: false
        type: string

# 이 workflow는 생성 데이터 2종을 commit/push 하므로 contents write만 허용한다.
permissions:
  contents: write

# KRX 생성 데이터 2종은 같은 branch 파일을 갱신하므로 workflow 실행을 직렬화한다.
# GAS의 request intent/receipt + branch/date operation marker가 동일/새 requestId 중복 dispatch를 막고, queue: max는 남은 pending 요청을 순차 처리한다.
concurrency:
  group: update-krx-prices-${{ github.ref }}
  queue: max

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      # 1) Repository / Python runtime
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 2) KRX price + performance snapshot update
      - name: Update KRX prices and snapshots
        env:
          INPUT_DATE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.date || '' }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            python scripts/update_prices.py --date "$INPUT_DATE"
          else
            python scripts/update_prices.py
          fi

      # 2-1) A stale or fallback price exits non-zero above. This guard keeps a
      # failed update out of the commit step even if the script behavior changes.
      - name: Verify generated prices are selectable closes only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          prices = json.loads(Path('data/prices.json').read_text(encoding='utf-8'))
          invalid = [date for date, row in prices.items() if row.get('display', True) and row.get('warnings')]
          if invalid:
              raise SystemExit('Selectable prices contain warnings: ' + ', '.join(invalid))
          PY

      # 3) Persist only the data files managed by update_prices.py.
      #    pension_contributions.json 등 다른 운영 JSON은 이 workflow에서 건드리지 않는다.
      - name: Commit generated KRX data
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          INPUT_REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.request_id || '' }}
        run: |
          if git diff --quiet data/prices.json data/performance_snapshots.json; then
            echo "No changes to commit."
            exit 0
          fi

          # updater가 시작한 checkout 기준점을 기억한다. push 전 remote가 앞서가더라도
          # pension 저장처럼 KRX managed/generation input을 건드리지 않은 변경만 rebase 후 안전하게 재시도한다.
          BASE_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/performance_snapshots.json
          if [ -n "$INPUT_REQUEST_ID" ]; then
            git commit -m "Update KRX prices and performance snapshots [$INPUT_REQUEST_ID]"
          else
            git commit -m "Update KRX prices and performance snapshots"
          fi

          KRX_MANAGED_PATHS=(data/prices.json data/performance_snapshots.json)
          KRX_INPUT_PATHS=(data/portfolio.json scripts/update_prices.py requirements.txt .github/workflows/update-prices.yml)
          LAST_PUSH_SHA=""

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH_NAME"

            # 직전 git push가 서버에서는 성공했지만 클라이언트가 응답을 받지 못한 경우를 먼저 수렴시킨다.
            # 이 검사를 managed-file guard보다 먼저 해야 자신의 성공 commit을 외부 충돌로 오인하지 않는다.
            if [ -n "$LAST_PUSH_SHA" ] && git merge-base --is-ancestor "$LAST_PUSH_SHA" "origin/$BRANCH_NAME"; then
              echo "Previous KRX push already reached origin/$BRANCH_NAME ($LAST_PUSH_SHA)."
              exit 0
            fi

            # checkout 이후 remote에서 KRX 관리파일 자체가 바뀌었다면 자동 merge로 덮지 않는다.
            # 이 경우는 실제 데이터 충돌이므로 fail-closed하고 다음 갱신에서 다시 계산한다.
            if ! git diff --quiet "$BASE_SHA" "origin/$BRANCH_NAME" -- "${KRX_MANAGED_PATHS[@]}"; then
              echo "KRX managed files changed on remote after checkout; aborting to avoid overwriting newer data." >&2
              exit 1
            fi

            # portfolio/updater/dependency/workflow가 checkout 이후 바뀌면 과거 입력으로 만든 결과를
            # 최신 코드 위에 rebase하지 않는다. 최신 remote 기준으로 다시 실행해야 한다.
            if ! git diff --quiet "$BASE_SHA" "origin/$BRANCH_NAME" -- "${KRX_INPUT_PATHS[@]}"; then
              echo "KRX generation inputs changed on remote after checkout; aborting stale generated data." >&2
              exit 1
            fi

            if ! git rebase "origin/$BRANCH_NAME"; then
              git rebase --abort || true
              echo "Failed to rebase KRX data commit onto latest $BRANCH_NAME." >&2
              exit 1
            fi

            PUSH_SHA="$(git rev-parse HEAD)"
            LAST_PUSH_SHA="$PUSH_SHA"
            if git push origin "HEAD:$BRANCH_NAME"; then
              exit 0
            fi

            echo "Push result was not confirmed; checking remote before retry ($attempt/3)." >&2
            sleep $((attempt * 2))
          done

          # 마지막 push도 응답만 유실됐을 수 있으므로 실패 확정 전에 remote를 한 번 더 확인한다.
          git fetch origin "$BRANCH_NAME"
          if [ -n "$LAST_PUSH_SHA" ] && git merge-base --is-ancestor "$LAST_PUSH_SHA" "origin/$BRANCH_NAME"; then
            echo "Final KRX push reached origin/$BRANCH_NAME despite an uncertain client response ($LAST_PUSH_SHA)."
            exit 0
          fi

          echo "KRX data push failed after 3 retries." >&2
          exit 1
