<script>
  try{const root=document.documentElement;if(localStorage.getItem('investmentDashboard.theme')==='dark')root.classList.add('dark');if(localStorage.getItem('investmentDashboard.cornerTheme')==='rounded')root.classList.add('rounded-corners')}catch(_){}

<link rel="stylesheet" href="common.css" />

</head>
<body>

<div class="wrap">

          <path d="M6 3h9l3 3v15H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M15 3v4h4M9 16l2-3 2 2 3-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

      <button class="btn" id="resetBtn" type="button" aria-label="기본값 복원"><span class="reset-text">기본값 복원</span><svg class="reset-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.34 5.66" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    </div>
    <p id="heroDescription">추가매수 당일 종가 또는 추가매수가 대비 변동률 기준 · 목표 매도단가와 3가지 손실 회복 방식 자동 계산</p>
  </div>

  <div class="preset-bar" role="group" aria-label="매수 사례 선택">
    <button class="preset-btn" type="button" data-preset="buy-2026-07-29" aria-pressed="false"><span class="preset-main">보유 중 추가매수</span></button>
    <button class="preset-btn" type="button" data-preset="buy-2026-07-30" aria-pressed="false"><span class="preset-main">이전 거래 후 재매수</span></button>
    <button class="preset-btn active" type="button" data-preset="current-only" aria-pressed="true"><span class="preset-main">이전 거래 없음</span></button>
  </div>

  <section class="panel input-panel add-card-shell add-card-base add-card-shadow">
    <div class="input-grid" id="inputGrid">
      <div class="input-group existing-group add-card-shell add-card-subtle" id="priorGroup">
        <div class="group-title add-heading-subsection"><span id="priorGroupTitle">기존 보유분</span><small id="priorGroupSub">기본 투자 정보</small></div>
        <div class="fields" id="holdingPriorFields">
          <div class="field" id="existingAvgField"><label id="existingAvgLabel" for="existingOriginalAvg">기존 보유분 원래 평단</label><input id="existingOriginalAvg" class="control" readonly></div>
          <div class="field" id="existingSharesField"><label id="existingSharesLabel" for="existingShares">기존 보유수량</label><div class="share-stepper"><button class="share-step-btn" type="button" data-target="existingShares" data-delta="-1" aria-label="기존 보유수량 1주 감소">−</button><input id="existingShares" class="control" type="number" min="0" step="1" inputmode="numeric" value="38"><button class="share-step-btn" type="button" data-target="existingShares" data-delta="1" aria-label="기존 보유수량 1주 증가">+</button></div></div>
          <div class="field" id="existingCostField"><label id="existingCostLabel" for="existingCost">기존 보유분 투자금액</label><input id="existingCost" class="control money-input" inputmode="numeric" value="7,005,530"></div>

          <div class="field" id="existingPLField"><label id="existingPLLabel" for="existingCurrentPL">기존 보유분 손익</label><input id="existingCurrentPL" class="control" readonly></div>
          <div class="field" id="oldRecoveryField"><label class="label-with-help"><span id="oldRecoveryLabel">기존 회수 대상 금액</span><span class="help-tooltip" id="oldRecoveryHelpWrap"><button type="button" class="help-icon" id="oldRecoveryHelp" aria-label="기존 회수 대상 금액 설명" aria-describedby="oldRecoveryTooltip" aria-expanded="false">i</button><span class="custom-tooltip" id="oldRecoveryTooltip" role="tooltip">기존 보유분에 사용된 마이너스통장 원금 등 매도대금으로 우선 회수·상환하려는 금액. 손실·평단·손익분기 계산 제외, 전략별 회수 결과에만 반영.</span></span></label><input id="oldOverdraft" class="control money-input" inputmode="numeric" value="3,700,000" aria-labelledby="oldRecoveryLabel"></div>
          <div class="existing-subsection existing-purchase-section" id="existingPurchaseSection"></div>
          <div class="existing-subsection existing-evaluation-section" id="existingEvaluationSection"></div>
          <div class="field" id="breakEvenInputField"><label id="breakEvenInputLabel" for="brokerBreakEven">통합 회복 기준가격</label><input id="brokerBreakEven" class="control" readonly></div>
          <input id="priorSettlementValue" type="hidden" value="0">
          <input id="priorSellPrice" type="hidden" value="0">
        </div>

        <div class="settled-summary" id="settledPriorSummary">
          <div class="prior-entry-grid">
            <div class="prior-date-section">
              <div class="field"><label for="priorSellDateInput">매도일</label><div class="date-control-shell"><input id="priorSellDateInput" class="control date-control" type="date" value="2026-07-30"></div></div>
            </div>
            <div class="prior-trade-section prior-buy-section">
              <div class="field auto-field"><label for="priorAvgDisplay">매수단가</label><input id="priorAvgDisplay" class="control" readonly></div>
              <div class="field"><label for="priorSoldSharesInput">매도수량</label><div class="share-stepper"><button class="share-step-btn" type="button" data-target="priorSoldSharesInput" data-delta="-1" aria-label="매도수량 1주 감소">−</button><input id="priorSoldSharesInput" class="control" type="number" min="0" step="1" inputmode="numeric" value="642"><button class="share-step-btn" type="button" data-target="priorSoldSharesInput" data-delta="1" aria-label="매도수량 1주 증가">+</button></div></div>
              <div class="field"><label for="priorCostInput">매수금액</label><input id="priorCostInput" class="control money-input" inputmode="numeric" value="51,912,930"></div>
            </div>
            <div class="prior-trade-section prior-sell-section">
              <div class="field auto-field"><label for="priorSellPriceDisplay">매도단가</label><input id="priorSellPriceDisplay" class="control" readonly></div>
              <div class="field"><label for="priorSettlementValueInput">매도금액</label><input id="priorSettlementValueInput" class="control money-input" inputmode="numeric" value="47,880,490"></div>
              <div class="field auto-field"><label for="priorPLDisplay">이전 거래 확정손익</label><input id="priorPLDisplay" class="control" readonly></div>
            </div>
          </div>
          <div class="case-note">매수단가·매도단가·확정손익은 실제 매수금액·매도금액 기준 자동 계산. 수수료·세금 등 거래비용 제외.</div>
        </div>
      </div>

      <div class="current-column" id="currentColumn">
        <div class="current-purchase-preset" id="currentPurchasePreset" role="group" aria-label="현재 보유분 빠른 매수값">
          <button class="current-purchase-btn" id="applyBuy20260804" type="button" data-current-purchase-preset="buy-2026-08-04" aria-pressed="false">2026-08-04 매수</button>
          <button class="current-purchase-btn" id="applyBuy20260806" type="button" data-current-purchase-preset="buy-2026-08-06" aria-pressed="false">2026-08-06 매수</button>
        </div>

      <div class="input-group additional-group add-card-shell add-card-subtle" id="currentGroup">
        <div class="group-title add-heading-subsection"><span id="currentGroupTitle">추가매수 내역</span><small id="currentGroupSub"><span class="desktop-only">실제 체결 기준 · 3개 전략 공통</span><span class="mobile-only">실제 체결 기준</span></small></div>
        <div class="fields" id="currentFields">
          <span id="currentPriceSlot"></span>
          <div class="current-subsection" id="purchaseInputSection"></div>

          <div class="current-subsection" id="recoveryResultSection"></div>
          <div class="settled-subsection settled-cost-section" id="settledCostSection"></div>
          <div class="settled-subsection settled-evaluation-section" id="settledEvaluationSection"></div>
          <div class="settled-subsection settled-result-section" id="settledResultSection"></div>

          <div class="field" id="actualLoanField"><label id="actualLoanLabel" for="actualLoan">추가매수금액</label><input id="actualLoan" class="control" readonly></div>
          <div class="field" id="currentBuyGainField"><label id="currentBuyGainLabel" for="currentBuyGain">추가매수가 대비 종가 변동률</label><input id="currentBuyGain" class="control" readonly></div>

          <div class="field" id="out2Field"><label id="out2Label" for="out2">최종 평가금액</label><input id="out2" class="control" readonly></div>
          <div class="field" id="out3Field"><label id="out3Label" for="out3">최종 보유수량</label><input id="out3" class="control" readonly></div>
          <div class="field" id="out4Field"><label id="out4Label" for="out4">추가매수 반영 총손익</label><input id="out4" class="control" readonly></div>
          <div class="field" id="out5Field"><label id="out5Label" for="out5">최종 투자금액</label><input id="out5" class="control" readonly></div>
          <div class="field" id="out6Field"><label id="out6Label" for="out6">추가매수 반영 총손익률</label><input id="out6" class="control" readonly></div>
        </div>
      </div>
      </div>

      <div class="input-group calculation-group add-card-shell add-card-subtle">
        <div class="group-title add-heading-subsection">계산 기준 <small>세 기준 중 하나만 입력</small></div>
        <div class="seg" role="group" aria-label="목표가격 계산 기준"><button id="modeCurrent" class="active" type="button" aria-pressed="true">매수일 종가</button><button id="modeRise" type="button" aria-pressed="false">추가매수가</button><button id="modeTarget" type="button" aria-pressed="false">목표단가</button></div>
        <div class="fields">
          <div class="field"><label id="overnightLabel" for="overnightPct">다음 거래일 변동률</label><div class="pct-stepper"><button class="pct-step-btn" type="button" data-target="overnightPct" data-delta="-0.1" aria-label="다음 거래일 변동률 0.1%p 감소">−</button><div class="with-unit"><input id="overnightPct" class="control" type="number" min="-99.999999" step="0.1" value="2.34"><span class="unit">%</span></div><button class="pct-step-btn" type="button" data-target="overnightPct" data-delta="0.1" aria-label="다음 거래일 변동률 0.1%p 증가">+</button></div></div>
          <div class="field"><label id="riseLabel" for="risePct">추가매수가 대비 변동률</label><div class="pct-stepper"><button class="pct-step-btn" type="button" data-target="risePct" data-delta="-0.1" aria-label="추가매수가 대비 변동률 0.1%p 감소">−</button><div class="with-unit"><input id="risePct" class="control" type="number" min="-99.999999" step="0.1" value="8.769"><span class="unit">%</span></div><button class="pct-step-btn" type="button" data-target="risePct" data-delta="0.1" aria-label="추가매수가 대비 변동률 0.1%p 증가">+</button></div></div>
          <div class="field full"><label for="targetPrice">목표 매도단가</label><input id="targetPrice" class="control money-input" inputmode="numeric" readonly></div>
        </div>
        <div class="formula" id="formulaText"></div>
        <button class="actual-sale-price" id="applyActualSellPrice" type="button" aria-label="실제 매도 단가를 목표 매도단가에 반영"><span>실제 매도 단가</span><strong id="actualSellPriceValue">91,065</strong></button>
      </div>
    </div>

  <section class="panel kpis add-card-shell add-card-base add-card-shadow">

    <div class="kpi add-card-shell add-card-control"><div class="name" id="kpi2Name"></div><div class="value" id="kpi2Value"></div><div class="sub" id="kpi2Sub"></div></div>
    <div class="kpi add-card-shell add-card-control"><div class="name" id="kpi3Name"></div><div class="value" id="kpi3Value"></div><div class="sub" id="kpi3Sub"></div></div>
    <div class="kpi add-card-shell add-card-control"><div class="name" id="kpi4Name"></div><div class="value" id="kpi4Value"></div><div class="sub" id="kpi4Sub"></div></div>
  </section>

  <section class="panel range-panel add-card-shell add-card-base add-card-shadow">
    <div class="range-box blue add-card-shell"><strong id="range1Title"></strong><div class="big" id="range1Value"></div><div class="muted" id="range1Sub"></div></div>
    <div class="range-box red add-card-shell"><strong id="range2Title"></strong><div class="big" id="range2Value"></div><div class="muted" id="range2Sub"></div></div>
    <div class="range-box green add-card-shell"><strong id="range3Title"></strong><div class="big" id="range3Value"></div><div class="muted" id="range3Sub"></div></div>
  </section>

  <div class="tabs" id="strategyTabs" role="tablist" aria-label="매도 전략 선택">
    <button class="tab active" id="tabS3" type="button" role="tab" data-tab="s3" aria-controls="s3" aria-selected="true" tabindex="0">① 전체 보유분 매도</button>
    <button class="tab" id="tabS2" type="button" role="tab" data-tab="s2" aria-controls="s2" aria-selected="false" tabindex="-1">② 추가매수 수량 매도</button>
    <button class="tab" id="tabS1" type="button" role="tab" data-tab="s1" aria-controls="s1" aria-selected="false" tabindex="-1">③ 추가매수 원금만 회수</button>
  </div>
  <main><section id="s3" class="strategy active" role="tabpanel" aria-labelledby="tabS3" aria-hidden="false" tabindex="0"></section><section id="s2" class="strategy" role="tabpanel" aria-labelledby="tabS2" aria-hidden="true" tabindex="0"></section><section id="s1" class="strategy" role="tabpanel" aria-labelledby="tabS1" aria-hidden="true" tabindex="0"></section></main>
</div>

<script src="calc.js"></script>
</body>
