<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>투자 손실 회복 계산기</title>
<style>
    :root{
      --bg:#f4f6fa;
      --card:#ffffff;
      --ink:#172033;
      --muted:#6c768a;
      --line:#dce2ec;
      --soft:#eef2f7;
      --navy:#1d3557;
      --navy2:#284b7c;
      --positive:#d9363e;
      --negative:#2463c7;
      --green:#198754;
      --amber:#a56a00;
      --shadow:0 10px 28px rgba(31,48,76,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45;overflow-x:hidden}
    button,input,select{font:inherit}
    .wrap{max-width:1480px;margin:0 auto;padding:26px}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
    .hero h1{margin:0;font-size:30px;letter-spacing:-.04em}
    .hero p{margin:7px 0 0;color:var(--muted)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;cursor:pointer;color:var(--ink)}
    .btn:hover{border-color:#aeb9ca;background:#fafbfd}
    .preset-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .preset-label{font-size:12px;color:var(--muted);font-weight:800;margin-right:2px}
    .preset-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:900}
    .preset-btn:hover{border-color:#9fb0c8;background:#f7f9fc;color:var(--ink)}
    .preset-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 14px rgba(29,53,87,.16)}

    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .input-panel{padding:18px;margin-bottom:16px}
    .input-grid{display:grid;grid-template-columns:1.15fr 1.15fr 1fr;gap:14px}
    .input-group{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fbfcfe}
    .group-title{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:12px}
    .group-title small{font-weight:500;color:var(--muted)}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field.full{grid-column:1/-1}
    label{font-size:12px;color:var(--muted);font-weight:700}
    .control{height:42px;border:1px solid #cfd7e4;border-radius:10px;background:#fff;padding:0 11px;outline:none;text-align:right;font-weight:700;color:var(--ink)}
    .control:focus{border-color:#6d8fc1;box-shadow:0 0 0 3px rgba(73,115,174,.12)}
    .control[readonly]{background:#f1f4f8;color:#576176}
    .with-unit{position:relative}
    .with-unit .control{padding-right:34px;width:100%}
    .unit{position:absolute;right:12px;bottom:10px;color:var(--muted);font-weight:700}
    .pct-stepper{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:5px;align-items:center}
    .pct-step-btn{height:42px;border:1px solid #cfd7e4;border-radius:9px;background:#fff;color:var(--navy);font-size:17px;font-weight:900;cursor:pointer;line-height:1;padding:0}
    .pct-step-btn:hover:not(:disabled){background:#f3f6fb;border-color:#9fb0c8}
    .pct-step-btn:disabled{cursor:not-allowed;color:#b5bdca;background:#f1f4f8}
    .pct-stepper input[type=number]::-webkit-inner-spin-button,.pct-stepper input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .pct-stepper input[type=number]{appearance:textfield;-moz-appearance:textfield}
    .share-stepper{display:block}
    .share-stepper .control{width:100%}
    .share-step-btn{display:none}
    .desktop-only{display:inline}
    .mobile-only{display:none}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
    .seg button{height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer;font-weight:800}
    .seg button.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .formula{font-size:11px;color:var(--muted);background:#f0f3f8;border-radius:8px;padding:7px 9px;margin-top:8px}
    .validation-panel{display:none;margin:0 0 16px;padding:13px 16px;border:1px solid #efb8bc;border-radius:14px;background:#fff5f5;color:#9c252d;font-size:13px;font-weight:700}
    .validation-panel.show{display:block}
    .validation-panel ul{margin:7px 0 0;padding-left:20px;font-weight:600}
    .control.invalid{border-color:#d9363e!important;background:#fff7f7!important;box-shadow:0 0 0 3px rgba(217,54,62,.10)!important}
    .invalid-results{padding:20px;border:1px dashed #efb8bc;border-radius:14px;background:#fff8f8;color:#9c252d;text-align:center;font-weight:800}
    .completed-summary{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:2px;padding-top:12px;border-top:1px dashed #cfd7e4}
    .completed-item{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 11px}
    .completed-item .cname{font-size:11px;color:var(--muted);font-weight:800}
    .completed-item .cvalue{font-size:17px;font-weight:900;margin-top:3px;letter-spacing:-.02em}

    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px;padding:16px 18px}
    .kpi{padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .kpi .name{font-size:12px;color:var(--muted);font-weight:700}
    .kpi .value{margin-top:5px;font-size:21px;font-weight:900;letter-spacing:-.03em}
    .kpi .sub{font-size:11px;color:var(--muted);margin-top:3px}

    .range-panel{padding:16px 18px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .range-box{border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
    .range-box strong{display:block;font-size:13px;margin-bottom:5px}
    .range-box .big{font-size:21px;font-weight:900}
    .range-box .muted{font-size:11px;line-height:1.4;margin-top:3px}
    .range-box.blue{background:#f3f7ff;border-color:#cddbf3}
    .range-box.red{background:#fff5f5;border-color:#f3cdcf}
    .range-box.green{background:#f2fbf6;border-color:#c9ead8}

    .tabs{display:flex;gap:8px;margin:0 0 12px;overflow:auto;padding:2px}
    .tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800;color:var(--muted)}
    .tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .strategy{display:none}
    .strategy.active{display:block}
    .strategy-card{overflow:hidden}
    .strategy-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:18px 20px;border-bottom:1px solid var(--line);background:#fbfcfe}
    .strategy-title h2{margin:0;font-size:20px}
    .strategy-title p{margin:6px 0 0;color:var(--muted);font-size:13px;white-space:nowrap}
    .badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap}
    .badge.bad{background:#fff0f0;color:#b72b32}
    .badge.conditional{background:#fff7df;color:#8a5b00}
    .badge.good{background:#eaf8ef;color:#177343}
    .strategy-body{padding:18px}
    .summary-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .summary-card{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff}
    .summary-card .sname{font-size:11px;color:var(--muted);font-weight:700}
    .summary-card .svalue{font-size:19px;font-weight:900;margin-top:4px}
    .section-title{font-weight:900;font-size:14px;margin:17px 0 8px}
    .table-scroll{width:100%;overflow-x:auto;border-radius:13px}
    .desktop-details{display:block}
    .mobile-data{display:none}
    .mobile-data-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:7px 13px;min-width:0}
    .mobile-section-title{font-size:12px;font-weight:900;color:var(--ink);padding:10px 0 5px}
    .mobile-section-title:first-child{padding-top:3px}
    .mobile-data-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
    .mobile-data-row:last-child{border-bottom:0}
    .mobile-data-label{flex:1;min-width:0;font-size:11px;color:var(--muted);font-weight:800;line-height:1.35}
    .mobile-data-value{flex:0 0 auto;max-width:55%;text-align:right;font-size:14px;font-weight:900;line-height:1.35;word-break:break-word}
    .data-grid{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));min-width:875px;border:1px solid var(--line);border-radius:13px;overflow:hidden}
    .cell{padding:10px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
    .cell:nth-child(7n){border-right:0}
    .data-grid .head{background:#f2f5f9;color:#5d6779;font-size:11px;font-weight:800;text-align:center;vertical-align:middle}
    .data-grid .val{font-weight:800;text-align:center;font-size:13px;vertical-align:middle}
    .data-grid .lastrow{border-bottom:0}
    .loan-grid{grid-template-columns:repeat(6,minmax(145px,1fr));min-width:870px}
    .loan-grid .cell:nth-child(7n){border-right:1px solid var(--line)}
    .loan-grid .cell:nth-child(6n){border-right:0}
    .final-grid{grid-template-columns:repeat(2,minmax(180px,1fr));min-width:360px}
    .final-grid .cell:nth-child(7n){border-right:1px solid var(--line)}
    .final-grid .cell:nth-child(2n){border-right:0}
    .warning-note{margin-top:13px;padding:11px 13px;border:1px solid #efb8bc;border-radius:11px;background:#fff2f2;color:#a5242c;font-size:12px;font-weight:900}
    .note{margin-top:13px;padding:11px 13px;border-radius:11px;background:#f5f7fb;color:#596478;font-size:12px}
    .positive{color:var(--positive)!important}
    .negative{color:var(--negative)!important}
    .zero{color:var(--ink)!important}
    .muted{color:var(--muted)!important}

    .footer{color:var(--muted);font-size:11px;text-align:center;padding:18px 0 8px}
    @media(max-width:1100px){
      .input-grid{grid-template-columns:1fr 1fr}.input-group:last-child{grid-column:1/-1}
      .kpis{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:720px){
      .wrap{padding:12px}.hero{display:block}.actions{margin-top:12px}
      .preset-bar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
      .preset-label{grid-column:1/-1;margin:0 0 1px}
      .preset-btn{min-width:0;width:100%;padding:9px 5px;font-size:12px}
      .input-panel{padding:12px}
      .input-grid,.input-group,.fields,.field,.share-stepper,.pct-stepper,.with-unit{min-width:0}
      .input-grid{width:100%}
      .input-group{width:100%;max-width:100%}
      .control{width:100%;min-width:0}
      .hero h1{font-size:24px}.input-grid{grid-template-columns:minmax(0,1fr)}.input-group:last-child{grid-column:auto}
      .kpis{grid-template-columns:1fr}
      .range-panel{grid-template-columns:1fr}
      .mobile-only{display:inline}
      .desktop-only{display:none}
      .share-stepper{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:5px;align-items:center}
      .share-step-btn{display:block;height:42px;border:1px solid #cfd7e4;border-radius:9px;background:#fff;color:var(--navy);font-size:16px;font-weight:900;cursor:pointer;line-height:1;padding:0}
      .share-step-btn:active{background:#f3f6fb}
      .existing-group .group-title small,.additional-group .group-title small,.calculation-group .group-title small{font-size:12px}
      .existing-group .field label,.additional-group .field label,.calculation-group .field label{font-size:11px}
      .existing-group .control,.additional-group .control,.calculation-group .control{font-size:15px}
      .existing-group .share-step-btn,.additional-group .share-step-btn,.calculation-group .pct-step-btn{font-size:16px}
      .calculation-group .seg button{font-size:15px}
      .calculation-group .unit{font-size:15px}
      .calculation-group{padding:9px}
      .calculation-group .fields{grid-template-columns:minmax(0,1fr)}
      .calculation-group .field.full{grid-column:auto}
      .summary-card .svalue{font-size:18px}
      .mobile-data-value{font-size:13px}
      .summary-row{grid-template-columns:repeat(2,1fr)}
      .strategy-head{display:block}.badge{display:inline-block;margin-top:10px}
      .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible;padding:0}
      .tab{min-width:0;width:100%;padding:8px 4px;font-size:11px;line-height:1.25;white-space:normal;word-break:keep-all}
      .desktop-details{display:none}
      .desktop-data{display:none}
      .mobile-data{display:grid;gap:8px}
      .strategy-title p{font-size:10px;white-space:nowrap;letter-spacing:-.025em}
      .existing-group,.additional-group{padding:9px}
      .existing-group .fields,.additional-group .fields{gap:8px}
      .existing-group .field,.additional-group .field{gap:4px}
      .existing-group .control,.additional-group .control{height:40px;padding-left:7px;padding-right:7px}
      .share-stepper{grid-template-columns:25px minmax(0,1fr) 25px;gap:3px}
      .share-step-btn{height:38px;border-radius:8px;font-size:14px}
      .strategy-body{padding:10px}
      .summary-row{gap:6px;margin-bottom:10px}
      .summary-card{padding:10px 8px;border-radius:12px;min-width:0}
      .summary-card .sname{font-size:10px;line-height:1.25}
      .summary-card .svalue{font-size:17px;line-height:1.2;letter-spacing:-.045em;white-space:nowrap}
      .mobile-data-card{padding:5px 9px}
      .mobile-data-row{gap:6px;padding:8px 0}
      .mobile-data-value{max-width:58%;white-space:nowrap;word-break:normal;letter-spacing:-.035em}
    }
  
    /* 2026-07-29 추가매수 내역: 매수·보유원가·종가평가·회복결과 4개 영역 */
    .additional-group.holding-layout #currentFields{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:0;
      align-items:start;
    }
    .current-subsection{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:10px;
      min-width:0;
      padding:0 10px 12px;
    }
    .current-subsection:nth-of-type(odd){border-right:1px dashed #cfd7e4}
    .current-subsection:nth-of-type(n+3){border-top:1px dashed #cfd7e4;padding-top:12px}
    .additional-group.settled-layout .current-subsection{display:none}

    /* 2026-07-30 현재 보유분: 보유원가·종가평가·손익결과 3개 영역 */
    .settled-subsection{display:none}
    .additional-group.settled-layout #currentFields{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:0;
      align-items:start;
    }
    .additional-group.settled-layout .settled-subsection{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:10px;
      min-width:0;
      padding:0 10px 12px;
    }
    .additional-group.settled-layout .settled-cost-section{border-right:1px dashed #cfd7e4}
    .additional-group.settled-layout .settled-result-section{
      grid-column:1 / -1;
      grid-template-columns:repeat(2,minmax(0,1fr));
      border-top:1px dashed #cfd7e4;
      padding-top:12px;
    }
    .additional-group.holding-layout .settled-subsection{display:none}

    .hidden{display:none!important}
    .settled-summary{display:none}
    .settled-loss-card{border:1px solid #efc3c6;background:#fff5f5;border-radius:13px;padding:14px 15px;margin-bottom:10px}
    .settled-loss-card .name{font-size:12px;color:var(--muted);font-weight:800}
    .settled-loss-card .value{font-size:23px;font-weight:900;margin-top:4px;color:var(--negative)}
    .prior-details{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
    .prior-details summary{cursor:pointer;list-style:none;padding:12px 14px;font-size:13px;font-weight:900;color:var(--navy);display:flex;align-items:center;justify-content:space-between}
    .prior-details summary::-webkit-details-marker{display:none}
    .prior-details summary::after{content:'＋';font-size:16px}
    .prior-details[open] summary::after{content:'−'}
    .prior-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 12px 12px}
    .prior-detail-item{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fbfcfe}
    .prior-detail-item .name{font-size:11px;color:var(--muted);font-weight:800}
    .prior-detail-item .value{font-size:15px;font-weight:900;margin-top:3px;word-break:break-all}
    .case-note{font-size:11px;color:var(--muted);margin-top:8px}
    #currentPriceSlot,#currentPriceAnchor{display:none!important}
    .strategy-card.no-badge .badge{display:none}
    .tabs.settled-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
    .simple-grid{grid-template-columns:repeat(4,minmax(145px,1fr));min-width:580px}
    .simple-grid .cell:nth-child(7n){border-right:1px solid var(--line)}
    .simple-grid .cell:nth-child(4n){border-right:0}
    @media(max-width:720px){
      .prior-detail-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:0 10px 10px}
      .prior-detail-item{padding:9px 9px}
      .prior-detail-item .name{font-size:10px}
      .prior-detail-item .value{font-size:13px}
      .settled-loss-card .value{font-size:21px}
      .tabs.settled-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
      .additional-group.holding-layout #currentFields{gap:0}
      .current-subsection{gap:8px;padding:0 6px 10px}
      .current-subsection:nth-of-type(n+3){padding-top:10px}
      .additional-group.settled-layout #currentFields{gap:0}
      .additional-group.settled-layout .settled-subsection{gap:8px;padding:0 6px 10px}
      .additional-group.settled-layout .settled-result-section{padding-top:10px}
    }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div>
      <h1>투자 손실 회복 계산기</h1>
      <p id="heroDescription">추가매수 당일 종가 또는 추가매수가 대비 변동률을 기준으로 목표 매도단가와 3가지 손실 회복 방식을 자동 계산합니다.</p>
    </div>
    <div class="actions"><button class="btn" id="resetBtn">기본값 복원</button></div>
  </div>

  <div class="preset-bar" aria-label="매수 사례 선택">
    <span class="preset-label">매수 사례</span>
    <button class="preset-btn" type="button" data-preset="buy-2026-07-29">2026-07-29 매수</button>
    <button class="preset-btn active" type="button" data-preset="buy-2026-07-30">2026-07-30 매수</button>
  </div>

  <section class="panel input-panel">
    <div class="input-grid">
      <div class="input-group existing-group" id="priorGroup">
        <div class="group-title"><span id="priorGroupTitle">기존 보유분</span><small id="priorGroupSub">기본 투자 정보</small></div>
        <div class="fields" id="holdingPriorFields">
          <div class="field" id="existingAvgField"><label>기존 보유분 원래 평단</label><input id="existingOriginalAvg" class="control" readonly></div>
          <div class="field" id="existingSharesField"><label>기존 보유수량</label><div class="share-stepper"><button class="share-step-btn" type="button" data-target="existingShares" data-delta="-1">−</button><input id="existingShares" class="control" type="number" min="0" step="1" inputmode="numeric" value="38"><button class="share-step-btn" type="button" data-target="existingShares" data-delta="1">+</button></div></div>
          <div class="field" id="existingCostField"><label>기존 보유분 투자금액</label><input id="existingCost" class="control money-input" inputmode="numeric" value="7,005,530"></div>
          <span id="currentPriceAnchor"></span>
          <div class="field" id="currentPriceField"><label id="currentPriceLabel">추가매수 당일 종가</label><input id="currentPrice" class="control money-input" inputmode="numeric" value="79,020"></div>
          <div class="field" id="existingValueField"><label>기존 보유분 평가금액</label><input id="existingCurrentValue" class="control" readonly></div>
          <div class="field" id="existingPLField"><label>기존 보유분 손익</label><input id="existingCurrentPL" class="control" readonly></div>
          <div class="field" id="oldRecoveryField"><label>기존 회수 대상 금액</label><input id="oldOverdraft" class="control money-input" inputmode="numeric" value="3,700,000"></div>

  const parseNum=v=>{const s=String(v??'').replace(/,/g,'').trim();if(s==='')return NaN;const n=Number(s);return Number.isFinite(n)?n:NaN;};

    const loss=Math.max(-priorPLFrom(v),0);
    if(qty<=0||v.currentPrice<=0||1-r<=0)return 0;

      $('currentPriceLabel').textContent='추가매수 당일 종가';

    const checks=[['currentPrice',caseType==='settled'?'기준 종가':'추가매수 당일 종가',i.currentPrice,n=>Number.isInteger(n)&&n>0],['addPrice',caseType==='settled'?'매수단가':'추가매수단가',i.addPrice,n=>Number.isInteger(n)&&n>0],['addShares',caseType==='settled'?'보유수량':'추가매수수량',i.addShares,n=>Number.isInteger(n)&&n>=0],['brokerFeePct','수수료율',i.brokerFeePct,n=>Number.isFinite(n)&&n>=0&&n<100]];

  function compute(){

    const addedPrincipal=i.addPrice*i.addShares;
    const finalShares=(settled?0:i.existingShares)+i.addShares;
    const finalCost=(settled?0:i.existingCost)+addedPrincipal;
    const finalAvg=finalShares?finalCost/finalShares:0;
    const buyFee=addedPrincipal*r;
    const allInCost=finalCost+buyFee;
    const currentValue=i.currentPrice*finalShares;
    const currentPositionPL=currentValue-allInCost;
    const currentPositionPLRate=finalCost?currentPositionPL/finalCost*100:0;
    const integratedCurrentPL=currentPositionPL+(settled?priorPL:0);
    const positionBERaw=finalShares?allInCost/(finalShares*(1-r)):0;
    const positionBE=Math.ceil(positionBERaw), positionBEOrder=ceil5(positionBERaw);
    const integratedBERaw=finalShares?(allInCost+recoveryAmount)/(finalShares*(1-r)):0;
    const integratedBE=Math.ceil(integratedBERaw), integratedBEOrder=ceil5(integratedBERaw);
    let targetPrice;
    if(mode==='current'){
      targetPrice=ceil5(i.currentPrice*(1+i.overnightPct/100));
      i.risePct=i.addPrice?(targetPrice/i.addPrice-1)*100:0;setPct('risePct',i.risePct);
    }else{
      targetPrice=ceil5(i.addPrice*(1+i.risePct/100));
      i.overnightPct=i.currentPrice?(targetPrice/i.currentPrice-1)*100:0;setPct('overnightPct',i.overnightPct);
    }
    const targetPositionNet=targetPrice*finalShares*(1-r)-allInCost;
    const targetIntegratedPL=targetPositionNet+(settled?priorPL:0);
    const addZeroRaw=i.addShares&&1-r>0?i.addPrice*(1+r)/(1-r):null;
    function strategy(type){
      const netPerShare=targetPrice*(1-r);
      let saleQty=type==='full'?finalShares:type==='addOnly'?i.addShares:Math.min(finalShares,netPerShare>0?Math.ceil(addedPrincipal/netPerShare):finalShares);
      const gross=targetPrice*saleQty, sellFee=gross*r, net=gross-sellFee;
      const allocatedBuyFee=finalShares?buyFee*(saleQty/finalShares):0;
      const realizedPL=net-finalAvg*saleQty-allocatedBuyFee;
      const remainShares=finalShares-saleQty, remainCost=finalAvg*remainShares, remainValue=targetPrice*remainShares, remainBuyFee=buyFee-allocatedBuyFee;
      const remainPL=remainValue-remainCost-remainBuyFee;
      const currentCombined=realizedPL+remainPL;
      const combined=currentCombined+(settled?priorPL:0);
      const principalRecovered=Math.min(net,addedPrincipal), principalShortfall=Math.max(addedPrincipal-net,0);
      const remainAfterPrincipal=Math.max(net-addedPrincipal,0);
      const recoveryPaid=Math.min(remainAfterPrincipal,recoveryAmount), recoveryBalance=Math.max(recoveryAmount-recoveryPaid,0), cashAfter=Math.max(remainAfterPrincipal-recoveryPaid,0);
      return {saleQty,gross,sellFee,net,realizedPL,remainShares,remainCost,remainValue,remainPL,currentCombined,combined,principalRecovered,principalShortfall,recoveryPaid,recoveryBalance,cashAfter};
    }
    return {i,settled,priorAvg,priorValue,priorPL,recoveryAmount,addedPrincipal,finalShares,finalCost,finalAvg,r,buyFee,allInCost,currentValue,currentPositionPL,currentPositionPLRate,integratedCurrentPL,positionBE,positionBEOrder,integratedBE,integratedBEOrder,targetPrice,targetPositionNet,targetIntegratedPL,addZeroRaw,sFull:strategy('full'),sAdd:strategy('addOnly'),sPrincipal:strategy('principal')};
  }

    $('existingShares').value=String(v.existingShares??0);$('existingCost').value=nf0.format(v.existingCost??0);$('priorSettlementValue').value=String(v.priorSettlementValue??0);$('priorSettlementFee').value=String(v.priorSettlementFee??0);$('priorSellPrice').value=String(v.priorSellPrice??0);$('currentPrice').value=nf0.format(v.currentPrice??0);$('oldOverdraft').value=nf0.format(v.oldRecovery??0);$('addPrice').value=nf0.format(v.addPrice??0);$('addShares').value=String(v.addShares??0);$('brokerFeePct').value=String(v.brokerFeePct??0.0036396);
    let overnight=v.overnightPct??0,rise=v.risePct??0;
    if(v.autoRecoveryTarget){const target=integratedRecoveryOrder(v);overnight=(target/v.currentPrice-1)*100;rise=(target/v.addPrice-1)*100;}
    setPct('overnightPct',overnight);setPct('risePct',rise);
    updateCaseUI();setMode(mode,false);recalc();
  }

  function applyPreset(id){if(!presets[id])return;applying=true;activePresetId=id;setPresetActive(id);$('priorDetails').open=false;applyValues({...presets[id]});document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='s3'));document.querySelectorAll('.strategy').forEach(s=>s.classList.toggle('active',s.id==='s3'));applying=false;}

  document.querySelectorAll('.money-input').forEach(inp=>{inp.addEventListener('focus',()=>{const n=parseNum(inp.value);if(Number.isFinite(n))inp.value=String(n);});inp.addEventListener('blur',()=>{const n=parseNum(inp.value);if(Number.isInteger(n))inp.value=nf0.format(n);recalc();});inp.addEventListener('input',()=>{markCustom();recalc();});});
  document.querySelectorAll('input[type=number]').forEach(inp=>inp.addEventListener('input',()=>{if(inp.id==='overnightPct'||inp.id==='risePct')delete inp.dataset.exactValue;markCustom();recalc();}));
  document.querySelectorAll('.share-step-btn').forEach(b=>b.addEventListener('click',()=>{const inp=$(b.dataset.target),cur=parseNum(inp.value);if(!Number.isFinite(cur))return;inp.value=String(Math.max(0,Math.trunc(cur)+parseNum(b.dataset.delta)));markCustom();recalc();}));
  document.querySelectorAll('.pct-step-btn').forEach(b=>b.addEventListener('click',()=>{const inp=$(b.dataset.target);if(inp.readOnly)return;const cur=parseNum(inp.value);if(!Number.isFinite(cur))return;delete inp.dataset.exactValue;inp.value=formatPctInput(Math.round((cur+parseNum(b.dataset.delta))*1e6)/1e6);markCustom();recalc();}));
  document.querySelectorAll('.preset-btn').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.preset)));
  $('modeCurrent').addEventListener('click',()=>{markCustom();setMode('current');});$('modeRise').addEventListener('click',()=>{markCustom();setMode('rise');});
  $('resetBtn').addEventListener('click',()=>{storage.remove('investmentLossRecoveryCalcV10');applyPreset(defaultPresetId);});
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.classList.contains('hidden'))return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.strategy').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));}));
  const saved=storage.get('investmentLossRecoveryCalcV10');
  if(saved){try{const v=JSON.parse(saved);applying=true;activePresetId=v.presetId&&presets[v.presetId]?v.presetId:'';setPresetActive(activePresetId);applyValues(v);applying=false;}catch(e){applyPreset(defaultPresetId);}}else applyPreset(defaultPresetId);
})();

</script>
</body>
</html>
