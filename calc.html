<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>투자 계산기</title>
<style>
    :root{
      --bg:#f4f6fa;
      --card:#ffffff;
      --ink:#172033;
      --muted:#6c768a;
      --line:#dce2ec;
      --soft:#eef2f7;
      --navy:#1d3557;
      --navy2:#284b7c;
      --positive:#EF3341;
      --negative:#3182F6;
      --green:#198754;
      --amber:#a56a00;
      --shadow:0 10px 28px rgba(31,48,76,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45;overflow-x:hidden}
    button,input,select{font:inherit}
    .wrap{max-width:1480px;margin:0 auto;padding:26px}
    .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
    .hero h1{margin:0;font-size:30px;letter-spacing:-.04em}
    .hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .reset-icon{display:none;width:18px;height:18px}
    .btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;cursor:pointer;color:var(--ink)}
    .btn:hover{border-color:#aeb9ca;background:#fafbfd}
    .preset-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .preset-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.25}
    .preset-btn .preset-main{font-size:13px}
    .preset-btn .preset-date{font-size:10px;font-weight:700;opacity:.72}
    .preset-btn:hover{border-color:#9fb0c8;background:#f7f9fc;color:var(--ink)}
    .preset-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 14px rgba(29,53,87,.16)}

    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .input-panel{padding:18px;margin-bottom:16px}
    .input-grid{display:grid;grid-template-columns:1.15fr 1.15fr 1fr;gap:14px}
    .input-grid.no-prior-layout{grid-template-columns:1.15fr 1fr}
    .input-group{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fbfcfe}
    .group-title{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:12px}
    .group-title small{font-weight:500;color:var(--muted)}
    .fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field.full{grid-column:1/-1}
    label{font-size:12px;color:var(--muted);font-weight:700}
    .label-with-help,.inline-help-label{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;position:relative}
    .inline-help-label{vertical-align:middle}
    .help-tooltip{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}
    .help-icon{width:17px;height:17px;border:1px solid #9eb0c9;border-radius:50%;background:#f3f7fc;color:#315a8f;font-size:11px;font-weight:900;line-height:15px;text-align:center;padding:0;cursor:help;font-family:inherit}
    .help-icon:hover,.help-icon:focus-visible{background:#e7f0fb;border-color:#6f8fb8;outline:none}
    .custom-tooltip{position:absolute;z-index:200;right:-8px;bottom:calc(100% + 9px);width:min(290px,calc(100vw - 34px));padding:10px 11px;border-radius:9px;background:#17243a;color:#fff;font-size:11px;font-weight:600;line-height:1.5;letter-spacing:-.01em;box-shadow:0 8px 22px rgba(20,35,60,.22);opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease,visibility .16s ease;pointer-events:none;text-align:left}
    .custom-tooltip::after{content:'';position:absolute;right:11px;top:100%;border:6px solid transparent;border-top-color:#17243a}
    .help-tooltip:hover .custom-tooltip,.help-tooltip:focus-within .custom-tooltip,.help-tooltip.is-open .custom-tooltip{opacity:1;visibility:visible;transform:translateY(0)}
    .control{height:42px;border:1px solid #cfd7e4;border-radius:10px;background:#fff;padding:0 11px;outline:none;text-align:right;font-weight:700;color:var(--ink)}
    .control:focus{border-color:#6d8fc1;box-shadow:0 0 0 3px rgba(73,115,174,.12)}
    .control[readonly]{background:#f1f4f8;color:#576176}
    .with-unit{position:relative}
    .with-unit .control{padding-right:34px;width:100%}
    .unit{position:absolute;right:12px;bottom:10px;color:var(--muted);font-weight:700}
    .pct-stepper{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:5px;align-items:center}
    .pct-step-btn{height:42px;border:1px solid #cfd7e4;border-radius:9px;background:#fff;color:var(--navy);font-size:17px;font-weight:900;cursor:pointer;line-height:1;padding:0}
    .pct-step-btn:hover:not(:disabled){background:#f3f6fb;border-color:#9fb0c8}
    .pct-step-btn:disabled{cursor:not-allowed;color:#b5bdca;background:#f1f4f8}
    .pct-stepper input[type=number]::-webkit-inner-spin-button,.pct-stepper input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
    .pct-stepper input[type=number]{appearance:textfield;-moz-appearance:textfield}
    .share-stepper{display:block}
    .share-stepper .control{width:100%}
    .share-step-btn{display:none}
    .desktop-only{display:inline}
    .mobile-only{display:none}
    .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:12px}
    .seg button{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer;font-weight:800;font-size:14px}
    .seg button.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .calculation-group .group-title{margin-bottom:0}
    .calculation-group .seg{margin-top:18px}
    @media(min-width:1101px){
      .calculation-group .seg{margin-top:35px;margin-bottom:10px}
    }
    .formula{font-size:11px;color:var(--muted);background:#f0f3f8;border-radius:8px;padding:7px 9px;margin-top:8px}
    .actual-sale-price{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:11px;font-weight:800;cursor:pointer;text-align:left;appearance:none;-webkit-appearance:none}
    .actual-sale-price:hover{border-color:#9fb0c8;background:#f7f9fc}
    .actual-sale-price:focus-visible{outline:none;border-color:#6d8fc1;box-shadow:0 0 0 3px rgba(73,115,174,.12)}
    .actual-sale-price:active{transform:translateY(1px)}
    .actual-sale-price strong{color:var(--navy);font-size:13px;font-weight:900;white-space:nowrap}
    .validation-panel{display:none;margin:0 0 16px;padding:13px 16px;border:1px solid #efb8bc;border-radius:14px;background:#fff5f5;color:#9c252d;font-size:13px;font-weight:700}
    .validation-panel.show{display:block}
    .validation-panel ul{margin:7px 0 0;padding-left:20px;font-weight:600}
    .control.invalid{border-color:#d9363e!important;background:#fff7f7!important;box-shadow:0 0 0 3px rgba(217,54,62,.10)!important}

    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px;padding:16px 18px}
    .kpi{padding:15px 16px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .kpi .name{font-size:12px;color:var(--muted);font-weight:700}
    .kpi .value{margin-top:5px;font-size:21px;font-weight:900;letter-spacing:-.03em}
    .kpi .sub{font-size:11px;color:var(--muted);margin-top:3px}

    .range-panel{padding:16px 18px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
    .range-box{border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
    .range-box strong{display:block;font-size:13px;margin-bottom:5px}
    .range-box .big{font-size:21px;font-weight:900}
    .range-box .muted{font-size:11px;line-height:1.4;margin-top:3px}
    .range-box.blue{background:#f3f7ff;border-color:#cddbf3}
    .range-box.red{background:#fff5f5;border-color:#f3cdcf}
    .range-box.green{background:#f2fbf6;border-color:#c9ead8}

    .tabs{display:flex;gap:8px;margin:0 0 12px;overflow:auto;padding:2px}
    .tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800;color:var(--muted)}
    .tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .strategy{display:none}
    .strategy.active{display:block}
    .strategy-card{overflow:hidden}
    .strategy-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:18px 20px;border-bottom:1px solid var(--line);background:#fbfcfe}
    .strategy-title h2{margin:0;font-size:20px}
    .strategy-title p{margin:6px 0 0;color:var(--muted);font-size:13px;white-space:nowrap}
    .badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;white-space:nowrap}
    .badge.bad{background:#fff0f0;color:#b72b32}
    .badge.conditional{background:#fff7df;color:#8a5b00}
    .badge.good{background:#eaf8ef;color:#177343}
    .strategy-body{padding:18px}
    .summary-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
    .summary-card{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff}
    .summary-card .sname{font-size:11px;color:var(--muted);font-weight:700}
    .summary-card .svalue{font-size:19px;font-weight:900;margin-top:4px}
    .section-title{font-weight:900;font-size:14px;margin:17px 0 8px}
    .table-scroll{width:100%;overflow-x:auto;border-radius:13px}
    .desktop-details{display:block}
    .mobile-data{display:none}
    .mobile-data-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:7px 13px;min-width:0}
    .mobile-section-title{font-size:12px;font-weight:900;color:var(--ink);padding:10px 0 5px}
    .mobile-section-title:first-child{padding-top:3px}
    .mobile-data-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft)}
    .mobile-data-row:last-child{border-bottom:0}
    .mobile-data-label{flex:1;min-width:0;font-size:11px;color:var(--muted);font-weight:800;line-height:1.35}
    .mobile-data-value{flex:0 0 auto;max-width:55%;text-align:right;font-size:14px;font-weight:900;line-height:1.35;word-break:break-word}
    .data-grid{display:grid;grid-template-columns:repeat(7,minmax(125px,1fr));min-width:875px;border:1px solid var(--line);border-radius:13px;overflow:hidden}
    .cell{padding:10px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
    .cell:nth-child(7n){border-right:0}
    .data-grid .head{background:#f2f5f9;color:#5d6779;font-size:11px;font-weight:800;text-align:center;vertical-align:middle}
    .data-grid .val{font-weight:800;text-align:center;font-size:13px;vertical-align:middle}
    .data-grid .lastrow{border-bottom:0}
    .loan-grid{grid-template-columns:repeat(6,minmax(145px,1fr));min-width:870px}
    .loan-grid .cell:nth-child(7n){border-right:1px solid var(--line)}
    .loan-grid .cell:nth-child(6n){border-right:0}
    .final-grid{grid-template-columns:repeat(2,minmax(180px,1fr));min-width:360px}
    .final-grid .cell:nth-child(7n){border-right:1px solid var(--line)}
    .final-grid .cell:nth-child(2n){border-right:0}
    .warning-note{margin-top:13px;padding:11px 13px;border:1px solid #efb8bc;border-radius:11px;background:#fff2f2;color:#a5242c;font-size:12px;font-weight:900}
    .note{margin-top:13px;padding:11px 13px;border-radius:11px;background:#f5f7fb;color:#596478;font-size:12px}
    .positive{color:var(--positive)!important}
    .negative{color:var(--negative)!important}
    .zero{color:var(--ink)!important}
    .muted{color:var(--muted)!important}

    @media(max-width:1100px){
      .input-grid{grid-template-columns:1fr 1fr}.input-group:last-child{grid-column:1/-1}
      .input-grid.no-prior-layout{grid-template-columns:1fr 1fr}
      .input-grid.no-prior-layout .input-group:last-child{grid-column:auto}
      .kpis{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:720px){
      .wrap{padding:12px}.hero{display:block;position:relative;padding-right:44px}.actions{position:absolute;right:0;top:0;margin:0}
      .hero p{font-size:11px;line-height:1.4}
      #resetBtn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
      #resetBtn .reset-text{display:none}
      #resetBtn .reset-icon{display:block}
      .preset-bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
      .preset-btn{min-width:0;width:100%;padding:8px 3px}
      .preset-btn .preset-main{font-size:10px;letter-spacing:-.04em}
      .preset-btn .preset-date{font-size:9px}
      .input-panel{padding:12px}
      .input-grid,.input-group,.fields,.field,.share-stepper,.pct-stepper,.with-unit{min-width:0}
      .input-grid{width:100%}
      .input-group{width:100%;max-width:100%}
      .control{width:100%;min-width:0}
      .hero h1{font-size:24px}.input-grid,.input-grid.no-prior-layout{grid-template-columns:minmax(0,1fr)}.input-group:last-child,.input-grid.no-prior-layout .input-group:last-child{grid-column:auto}
      .kpis{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
        padding:10px;
      }
      .kpi{
        min-width:0;
        padding:10px 8px;
      }
      .kpi .name{
        font-size:10px;
        white-space:nowrap;
        letter-spacing:-.055em;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .kpi .value{
        font-size:17px;
        white-space:nowrap;
        letter-spacing:-.045em;
      }
      .kpi .sub{
        font-size:9px;
        white-space:nowrap;
        letter-spacing:-.045em;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .range-panel{grid-template-columns:1fr}
      .mobile-only{display:inline}
      .desktop-only{display:none}
      .share-stepper{display:grid;grid-template-columns:30px minmax(0,1fr) 30px;gap:5px;align-items:center}
      .share-step-btn{display:block;height:42px;border:1px solid #cfd7e4;border-radius:9px;background:#fff;color:var(--navy);font-size:16px;font-weight:900;cursor:pointer;line-height:1;padding:0}
      .share-step-btn:active{background:#f3f6fb}
      .existing-group .group-title small,.additional-group .group-title small,.calculation-group .group-title small{font-size:12px}
      .existing-group .field label,.additional-group .field label,.calculation-group .field label{font-size:11px}
      .existing-group .control,.additional-group .control,.calculation-group .control{font-size:16px}
      .existing-group .share-step-btn,.additional-group .share-step-btn,.calculation-group .pct-step-btn{font-size:16px}
      .calculation-group .seg{margin-top:8px}
      .calculation-group .seg button{height:40px;font-size:11px;padding:0 3px;letter-spacing:-.025em}
      .calculation-group .unit{font-size:15px}
      .calculation-group{padding:9px}
      .calculation-group .fields{grid-template-columns:minmax(0,1fr)}
      .calculation-group .field.full{grid-column:auto}
      .summary-card .svalue{font-size:18px}
      .mobile-data-value{font-size:13px}
      .summary-row{grid-template-columns:repeat(2,1fr)}
      .strategy-head{display:block}.badge{display:inline-block;margin-top:10px}
      .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;overflow:visible;padding:0}
      .tab{min-width:0;width:100%;padding:8px 4px;font-size:11px;line-height:1.25;white-space:normal;word-break:keep-all}
      .desktop-details{display:none}
      .desktop-data{display:none}
      .mobile-data{display:grid;gap:8px}
      .strategy-title p{font-size:10px;white-space:nowrap;letter-spacing:-.025em}
      .existing-group,.additional-group{padding:9px}
      .existing-group .fields,.additional-group .fields{gap:8px}
      .existing-group .field,.additional-group .field{gap:4px}
      .existing-group .control,.additional-group .control{height:40px;padding-left:7px;padding-right:7px}
      .share-stepper{grid-template-columns:25px minmax(0,1fr) 25px;gap:3px}
      .share-step-btn{height:38px;border-radius:8px;font-size:14px}
      .strategy-body{padding:10px}
      .summary-row{gap:6px;margin-bottom:10px}
      .summary-card{padding:10px 8px;border-radius:12px;min-width:0}
      .summary-card .sname{font-size:10px;line-height:1.25}
      .summary-card .svalue{font-size:17px;line-height:1.2;letter-spacing:-.045em;white-space:nowrap}
      .mobile-data-card{padding:5px 9px}
      .mobile-data-row{gap:6px;padding:8px 0}
      .mobile-data-value{max-width:58%;white-space:nowrap;word-break:normal;letter-spacing:-.035em}
    }

    /* 2026-07-29 기존 보유분: 기존 매수정보·평가/회수정보 2개 영역 */
    .existing-group.holding-layout #holdingPriorFields{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:0;
      align-items:start;
    }
    .existing-subsection{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:10px;
      min-width:0;
      padding:0 10px 12px;
    }
    .existing-purchase-section{border-right:1px dashed #cfd7e4}
    .existing-group:not(.holding-layout) .existing-subsection{display:none}

    /* 2026-07-29 추가매수 내역: 매수·보유원가·종가평가·회복결과 4개 영역 */
    .additional-group.holding-layout #currentFields{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:0;
      align-items:start;
    }
    .current-subsection{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:10px;
      min-width:0;
      padding:0 10px 12px;
    }
    .current-subsection:nth-of-type(odd){border-right:1px dashed #cfd7e4}
    .current-subsection:nth-of-type(n+3){border-top:1px dashed #cfd7e4;padding-top:12px}
    .additional-group.settled-layout .current-subsection{display:none}

    /* 2026-07-30 현재 보유분: 보유원가·종가평가·손익결과 3개 영역 */
    .settled-subsection{display:none}
    .additional-group.settled-layout #currentFields{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:0;
      align-items:start;
    }
    .additional-group.settled-layout .settled-subsection{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      gap:10px;
      min-width:0;
      padding:0 10px 12px;
    }
    .additional-group.settled-layout .settled-cost-section{border-right:1px dashed #cfd7e4}
    .additional-group.settled-layout .settled-result-section{
      grid-column:1 / -1;
      grid-template-columns:repeat(2,minmax(0,1fr));
      border-top:1px dashed #cfd7e4;
      padding-top:12px;
    }
    .additional-group.settled-layout.no-prior-current .settled-result-section{
      grid-template-columns:minmax(0,1fr);
    }
    .additional-group.holding-layout .settled-subsection{display:none}

    .hidden{display:none!important}
    .settled-summary{display:none}
    .prior-entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;align-items:start}
    .prior-date-section{grid-column:1/-1;min-width:0;padding:0 10px 12px;border-bottom:1px dashed #cfd7e4}
    .prior-trade-section{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0;padding:12px 10px}
    .prior-buy-section{border-right:1px dashed #cfd7e4}
    .prior-entry-grid .field{min-width:0}
    .date-control-shell{position:relative;width:100%;min-width:0;max-width:100%;height:42px;border:1px solid #cfd7e4;border-radius:10px;background:#fff;overflow:hidden;box-sizing:border-box}
    .date-control-shell:focus-within{border-color:#6d8fc1;box-shadow:0 0 0 3px rgba(73,115,174,.12)}
    .date-control-shell .date-control{position:absolute;inset:0;display:block;width:100%!important;min-width:0!important;max-width:100%!important;height:100%;border:0!important;border-radius:0;background:transparent!important;box-shadow:none!important;outline:none;text-align:left;padding:0 11px;box-sizing:border-box;-webkit-min-logical-width:0}
    .date-control-shell .date-control::-webkit-date-and-time-value{height:100%;min-height:100%;margin:0;padding:0;display:flex;align-items:center;justify-content:center;text-align:center}
    .date-control-shell .date-control::-webkit-datetime-edit{height:100%;padding:0;display:flex;align-items:center;justify-content:center}
    .date-control-shell .date-control::-webkit-datetime-edit-fields-wrapper{display:flex;align-items:center;justify-content:center;height:100%;padding:0}

  function compute(){

    const priorPL=settled?i.priorSettlementValue-i.existingCost:priorValue-i.existingCost;
    const recoveryAmount=settled?0:i.oldRecovery;

    }else{
      targetPrice=ceil5(i.targetPrice);
      i.overnightPct=i.currentPrice?(targetPrice/i.currentPrice-1)*100:0;
      i.risePct=i.addPrice?(targetPrice/i.addPrice-1)*100:0;

    const addZeroRaw=i.addShares?i.addPrice:null;
    function strategy(type){
      const valuePerShare=targetPrice;

    const saleV=[{text:won(c.targetPrice)},{text:shareText(d.saleQty)},{text:won(d.gross)},{text:won(d.realizedPL),cls:signClass(d.realizedPL)},{text:shareText(d.remainShares)}];
    const flowH=['추가매수 원금 회수액','투입금액 회수 후 잔여현금','추가매수 원금 미회수액','기존 금액 회수액','기존 회수 대상 잔액','추가투입금·회수대상 차감 후 잔여현금'];
    const flowV=[{text:won(d.principalRecovered)},{text:won(Math.max(d.net-c.addedPrincipal,0))},{text:won(d.principalShortfall),cls:d.principalShortfall?'negative':''},{text:won(d.recoveryPaid)},{text:won(d.recoveryBalance),cls:d.recoveryBalance?'negative':''},{text:won(d.cashAfter),cls:d.cashAfter?'positive':''}];
    const full=typeNo===3;
    const remH=full?['보유수량','합산 손익']:['평단','보유수량','투자금액','평가가격','평가금액','평가손익','합산 손익'];
    const remV=full?[{text:shareText(d.remainShares)},{text:won(d.combined),cls:signClass(d.combined)}]:[{text:won(c.finalAvg)},{text:shareText(d.remainShares)},{text:won(d.remainCost)},{text:won(c.targetPrice)},{text:won(d.remainValue)},{text:won(d.remainPL),cls:signClass(d.remainPL)},{text:won(d.combined),cls:signClass(d.combined)}];
    return `<div class="panel strategy-card"><div class="strategy-head"><div class="strategy-title"><h2>${displayNo} ${title}</h2><p>${desc}</p></div><span class="badge ${badgeCls}">${badge}</span></div><div class="strategy-body"><div class="summary-row">${metric('매도금액',won(d.net))}${metric('합산 손익',won(d.combined),signClass(d.combined))}${metric('추가투입금·회수대상 차감 후 잔여현금',won(d.cashAfter),d.cashAfter?'positive':'')}${metric('추가매수 전 대비 손익 개선액',won(d.combined-(c.i.existingShares*c.targetPrice-c.i.existingCost)),signClass(d.combined-(c.i.existingShares*c.targetPrice-c.i.existingCost)))}</div><div class="desktop-details"><div class="section-title">매도 결과</div>${desktopGrid(saleH,saleV,'five-grid')}<div class="section-title">원금 회수 결과</div>${desktopGrid(flowH,flowV,'loan-grid')}<div class="section-title">${full?'매도 후 최종 상태':'매도 후 보유 현황'}</div>${desktopGrid(remH,remV,full?'final-grid':'')}</div><div class="mobile-data">${mobileRows('매도 결과',saleH,saleV)}${mobileRows('원금 회수 결과',flowH,flowV)}${mobileRows(full?'매도 후 최종 상태':'매도 후 보유 현황',remH,remV)}</div><div class="note">${typeNo===1?'매도금액이 추가매수금액과 같거나 넘도록 필요한 최소 매도수량을 올림 처리합니다.':typeNo===2?`추가매수 수량 ${shareText(c.i.addShares)}를 그대로 매도하고 기존 보유분은 유지합니다.`:'전체 보유분 매도 후 보유수량은 0주가 됩니다.'} 수수료·세금 등 거래비용은 반영하지 않습니다.</div></div></div>`;
  }

  function settledStrategyHTML(kind,d,c){
    const full=kind==='full';
    const title=full?'① 전체 보유분 매도':'② 투자원금만 회수';
    const desc=c.noPrior
      ?(full?'<span class="desktop-only">현재 보유분을 전량 매도했을 때 실현손익을 계산합니다.</span><span class="mobile-only">전량 매도 후 실현손익을 계산합니다.</span>':'<span class="desktop-only">매도금액이 현재 투자금액에 도달하도록 최소 수량만 매도하고 나머지는 보유합니다.</span><span class="mobile-only">원금 회수분만 매도하고 나머지는 보유합니다.</span>')
      :(full?`<span class="desktop-only">현재 ${shareText(c.finalShares)}를 전량 매도했을 때 현재 보유분과 이전 거래 확정손익을 합산합니다.</span><span class="mobile-only">전량 매도 후 현재 보유분·이전 손익을 합산합니다.</span>`:'<span class="desktop-only">매도금액이 현재 투자금액에 도달하도록 최소 수량만 매도하고 나머지는 보유합니다.</span><span class="mobile-only">원금 회수분만 매도하고 나머지는 보유합니다.</span>');
    const saleH=['매도단가','매도수량','매도금액','현재 보유분 실현손익','매도 후 보유수량'];
    const saleV=[{text:won(c.targetPrice)},{text:shareText(d.saleQty)},{text:won(d.gross)},{text:won(d.realizedPL),cls:signClass(d.realizedPL)},{text:shareText(d.remainShares)}];
    const integratedH=c.noPrior?['목표가격 기준 손익','목표가격 수익률']:['현재 보유분 손익','이전 거래 확정손익','통합손익'];
    const targetRate=c.finalCost?d.currentCombined/c.finalCost*100:0;
    const integratedV=c.noPrior?[{text:won(d.currentCombined),cls:signClass(d.currentCombined)},{text:pct(targetRate,2),cls:signClass(targetRate)}]:[{text:won(d.currentCombined),cls:signClass(d.currentCombined)},{text:won(c.priorPL),cls:signClass(c.priorPL)},{text:won(d.combined),cls:signClass(d.combined)}];
    const remainH=full?['보유수량',c.noPrior?'최종 손익':'최종 통합손익']:['남은 보유수량','남은 투자원가','목표가격 평가금액','남은 보유분 평가손익'];
    const remainV=full?[{text:shareText(0)},{text:won(c.noPrior?d.currentCombined:d.combined),cls:signClass(c.noPrior?d.currentCombined:d.combined)}]:[{text:shareText(d.remainShares)},{text:won(d.remainCost)},{text:won(d.remainValue)},{text:won(d.remainPL),cls:signClass(d.remainPL)}];
    const warning=!full&&d.principalShortfall>0?`<div class="warning-note">현재 목표가격에서는 전량을 매도해도 투자원금이 ${won(d.principalShortfall)} 부족합니다.</div>`:'';
    const summary=c.noPrior
      ?`${metric('매도금액',won(d.net))}${metric('현재 보유분 실현손익',won(d.realizedPL),signClass(d.realizedPL))}${metric('매도 후 보유수량',shareText(d.remainShares))}${metric('목표가격 기준 전체 손익',won(d.currentCombined),signClass(d.currentCombined))}`
      :`${metric('매도금액',won(d.net))}${metric('현재 보유분 손익',won(d.currentCombined),signClass(d.currentCombined))}${metric('이전 거래 확정손익',won(c.priorPL),signClass(c.priorPL))}${metric('통합손익',won(d.combined),signClass(d.combined))}`;
    const integrationTitle=c.noPrior?'손익 요약':'손익 통합';
    const integrationGridClass=c.noPrior?'final-grid':'triple-grid';
    const note=c.noPrior
      ?(full?'현재 보유분의 최종 실현손익입니다.':'현재 투자원금만 회수하고 남은 주식은 목표가격 기준 평가금액으로 표시합니다.')
      :(full?'현재 보유분 실현손익에 이전 거래 확정손익을 더해 통합손익을 계산합니다.':'현재 투자원금만 회수하고 남은 주식은 목표가격 기준 평가금액으로 표시합니다. 이전 거래 확정손익은 통합손익에 계속 포함됩니다.');
    return `<div class="panel strategy-card no-badge"><div class="strategy-head"><div class="strategy-title"><h2>${title}</h2><p>${desc}</p></div></div><div class="strategy-body"><div class="summary-row">${summary}</div><div class="desktop-details"><div class="section-title">매도 결과</div>${desktopGrid(saleH,saleV,'five-grid')}<div class="section-title">${integrationTitle}</div>${desktopGrid(integratedH,integratedV,integrationGridClass)}<div class="section-title">${full?'매도 후 최종 상태':'원금 회수 후 보유 현황'}</div>${desktopGrid(remainH,remainV,full?'final-grid':'simple-grid')}</div><div class="mobile-data">${mobileRows('매도 결과',saleH,saleV)}${mobileRows(integrationTitle,integratedH,integratedV)}${mobileRows(full?'매도 후 최종 상태':'원금 회수 후 보유 현황',remainH,remainV)}</div>${warning}<div class="note">${note} 수수료·세금 등 거래비용은 반영하지 않습니다.</div></div></div>`;
  }

      $('s2').innerHTML=holdingStrategyHTML(2,'②','추가매수 수량 매도','조건부 추천','conditional','추가매수 수량만 매도하고 기존 보유분은 유지합니다.',c.sAdd,c);
      $('s3').innerHTML=holdingStrategyHTML(3,'①','전체 보유분 매도','추천','good','전체 보유분을 매도해 투입금액 회수를 우선합니다.',c.sFull,c);
    }
  }

  function recalc(){const i=getInputs(),errors=validate(i);showValidation(errors);if(errors.length)return;const c=compute();render(c);storage.set('investmentLossRecoveryCalcV17',JSON.stringify({...c.i,targetPrice:c.targetPrice,caseType,noPrior:noPriorMode,mode,presetId:activePresetId,currentPurchasePresetId,autoBreakEvenTarget}));}

  function setMode(next,doRecalc=true){mode=['current','rise','target'].includes(next)?next:'current';$('modeCurrent').classList.toggle('active',mode==='current');$('modeRise').classList.toggle('active',mode==='rise');$('modeTarget').classList.toggle('active',mode==='target');$('overnightPct').readOnly=mode!=='current';$('risePct').readOnly=mode!=='rise';$('targetPrice').readOnly=mode!=='target';document.querySelectorAll('.pct-step-btn').forEach(b=>b.disabled=$(b.dataset.target).readOnly);const targetFormula='목표 매도단가 직접 입력 → 5원 단위 올림 · 두 변동률 자동 계산';let formula;if(mode==='current'&&autoBreakEvenTarget){formula=caseType==='holding'?'손익분기 가격 기준으로 다음 거래일 변동률 자동 설정':(noPriorMode?'현재 보유분 손익분기 가격 기준으로 목표 변동률 자동 설정':'이전 손익 반영 통합 회복가격 기준으로 목표 변동률 자동 설정');}else{formula=mode==='target'?targetFormula:(caseType==='settled'?(mode==='current'?'매수일 종가 × (1 + 목표 변동률 %) → 5원 단위 올림':'매수단가 × (1 + 목표 변동률 %) → 5원 단위 올림'):(mode==='current'?'추가매수 당일 종가 × (1 + 다음 거래일 변동률 %) → 5원 단위 올림':'추가매수단가 × (1 + 추가매수가 대비 변동률 %) → 5원 단위 올림'));}$('formulaText').textContent=formula;if(doRecalc)recalc();}

  function applyValues(v){
    caseType=v.caseType||'holding';noPriorMode=!!v.noPrior;mode=['current','rise','target'].includes(v.mode)?v.mode:'current';autoBreakEvenTarget=!!v.autoBreakEvenTarget;currentPurchasePresetId=noPriorMode&&currentPurchasePresets[v.currentPurchasePresetId]?v.currentPurchasePresetId:null;setCurrentPurchasePresetActive(currentPurchasePresetId);
    $('existingShares').value=String(v.existingShares??0);$('existingCost').value=nf0.format(v.existingCost??0);$('priorSettlementValue').value=String(v.priorSettlementValue??0);$('priorSellPrice').value=String(v.priorSellPrice??0);$('currentPrice').value=nf0.format(v.currentPrice??0);$('oldOverdraft').value=nf0.format(v.oldRecovery??0);$('addPrice').value=nf0.format(v.addPrice??0);$('addShares').value=String(v.addShares??0);
    $('priorSellDateInput').value=v.priorSellDate||'';$('priorSoldSharesInput').value=String(v.existingShares??0);$('priorCostInput').value=nf0.format(v.existingCost??0);$('priorSettlementValueInput').value=nf0.format(v.priorSettlementValue??0);
    let overnight=v.overnightPct??0,rise=v.risePct??0,target=v.targetPrice??0;
    if(autoBreakEvenTarget){
      if(caseType==='holding'){
        const shares=(v.existingShares||0)+(v.addShares||0),cost=(v.existingCost||0)+(v.addPrice||0)*(v.addShares||0);
        target=shares?ceil5(cost/shares):0;
      }else if(noPriorMode){
        target=(v.addShares||0)>0?ceil5(v.addPrice||0):0;
      }else{
        target=integratedRecoveryOrder(v);
      }
      overnight=v.currentPrice?(target/v.currentPrice-1)*100:0;
      rise=v.addPrice?(target/v.addPrice-1)*100:0;
    }
    if(!target){target=mode==='rise'?ceil5((v.addPrice||0)*(1+rise/100)):ceil5((v.currentPrice||0)*(1+overnight/100));}
    setPct('overnightPct',overnight);setPct('risePct',rise);$('targetPrice').value=nf0.format(target);
    updateCaseUI();setMode(mode,false);recalc();
  }

  function applyPreset(id){if(!presets[id])return;applying=true;activePresetId=id;setPresetActive(id);applyValues({...presets[id]});document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='s3'));document.querySelectorAll('.strategy').forEach(s=>s.classList.toggle('active',s.id==='s3'));applying=false;}

  document.querySelectorAll('.money-input').forEach(inp=>{inp.addEventListener('focus',()=>{const n=parseNum(inp.value);if(Number.isFinite(n))inp.value=String(n);});inp.addEventListener('blur',()=>{const n=parseNum(inp.value);if(Number.isInteger(n))inp.value=nf0.format(n);recalc();});inp.addEventListener('input',()=>{if(inp.id==='targetPrice')disableAutoBreakEven();markCustom();recalc();});});
  document.querySelectorAll('input[type=number]').forEach(inp=>inp.addEventListener('input',()=>{if(inp.id==='overnightPct'||inp.id==='risePct'){delete inp.dataset.exactValue;disableAutoBreakEven();}markCustom();recalc();}));
  document.querySelectorAll('.share-step-btn').forEach(b=>b.addEventListener('click',()=>{const inp=$(b.dataset.target),cur=parseNum(inp.value);if(!Number.isFinite(cur))return;inp.value=String(Math.max(0,Math.trunc(cur)+parseNum(b.dataset.delta)));markCustom();recalc();}));
  document.querySelectorAll('.pct-step-btn').forEach(b=>b.addEventListener('click',()=>{const inp=$(b.dataset.target);if(inp.readOnly)return;const cur=parseNum(inp.value);if(!Number.isFinite(cur))return;delete inp.dataset.exactValue;disableAutoBreakEven();inp.value=formatPctInput(Math.round((cur+parseNum(b.dataset.delta))*1e6)/1e6);markCustom();recalc();}));
  document.querySelectorAll('.preset-btn').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.preset)));
  $('modeCurrent').addEventListener('click',()=>{disableAutoBreakEven();markCustom();setMode('current');});$('modeRise').addEventListener('click',()=>{disableAutoBreakEven();markCustom();setMode('rise');});$('modeTarget').addEventListener('click',()=>{disableAutoBreakEven();markCustom();setMode('target');});
  document.querySelectorAll('.current-purchase-btn').forEach(b=>b.addEventListener('click',()=>{
    if(!noPriorMode)return;
    const preset=currentPurchasePresets[b.dataset.currentPurchasePreset];
    if(!preset)return;
    currentPurchasePresetId=b.dataset.currentPurchasePreset;
    setCurrentPurchasePresetActive(currentPurchasePresetId);
    activePresetId='current-only';
    setPresetActive(activePresetId);
    autoBreakEvenTarget=true;
    mode='current';
    $('addPrice').value=nf0.format(preset.addPrice);
    $('currentPrice').value=nf0.format(preset.currentPrice);
    $('addShares').value=String(preset.addShares);
    updateActualSellPriceUI();
    setMode('current',false);
    recalc();
  }));
  $('applyActualSellPrice').addEventListener('click',()=>{
    const actualSellPrice=getActualSellPrice();
    if(!Number.isFinite(actualSellPrice))return;
    disableAutoBreakEven();
    setMode('target',false);
    $('targetPrice').value=nf0.format(actualSellPrice);
    recalc();
  });
  $('priorSellDateInput').addEventListener('input',()=>{markCustom();recalc();});
  $('resetBtn').addEventListener('click',()=>{storage.remove('investmentLossRecoveryCalcV17');storage.remove('investmentLossRecoveryCalcV16');storage.remove('investmentLossRecoveryCalcV15');storage.remove('investmentLossRecoveryCalcV12');applyPreset(defaultPresetId);});
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.classList.contains('hidden'))return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.strategy').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab));}));
  document.addEventListener('click',e=>{
    const btn=e.target.closest('.help-icon');
    document.querySelectorAll('.help-tooltip.is-open').forEach(w=>{if(!btn||w!==btn.closest('.help-tooltip')){w.classList.remove('is-open');const b=w.querySelector('.help-icon');if(b)b.setAttribute('aria-expanded','false');}});
    if(btn){e.stopPropagation();const wrap=btn.closest('.help-tooltip');const open=wrap.classList.toggle('is-open');btn.setAttribute('aria-expanded',String(open));}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.help-tooltip.is-open').forEach(w=>{w.classList.remove('is-open');const b=w.querySelector('.help-icon');if(b){b.setAttribute('aria-expanded','false');b.blur();}});}});
  const saved=storage.get('investmentLossRecoveryCalcV17');
  if(saved){try{const v=JSON.parse(saved);applying=true;activePresetId=v.presetId&&presets[v.presetId]?v.presetId:(v.noPrior?'current-only':(v.caseType==='holding'?'buy-2026-07-29':'buy-2026-07-30'));setPresetActive(activePresetId);applyValues(v);applying=false;}catch(e){applyPreset(defaultPresetId);}}else applyPreset(defaultPresetId);
})();

</script>
</body>
</html>
